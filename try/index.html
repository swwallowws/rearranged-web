<!doctype html>
<html lang="en" data-category="transform">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rearranged: guided part</title>
  <link rel="icon" href="../favicons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="../favicons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../favicons/apple-touch-icon.png">
  <link rel="stylesheet" href="../vendor/design/tokens.css">
  <link rel="stylesheet" href="../vendor/design/steprail.css">
  <link rel="stylesheet" href="../vendor/design/iconbutton.css">
  <link rel="stylesheet" href="../vendor/design/demoshell.css">
  <link rel="stylesheet" href="../vendor/design/playhead.css">
  <link rel="stylesheet" href="try.css">
  <script>
    // Set the mode before first paint: ?theme=paper|night (from the showcase
    // frame) wins; otherwise the system scheme applies. The demo shell reads
    // ?embed=1 itself.
    (function () {
      var q = new URLSearchParams(location.search);
      var t = q.get("theme");
      if (t === "paper" || t === "night") document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div id="demo">
    <div class="live">
      <p id="missing" class="missing" hidden></p>

      <section class="pane" id="part-pane" aria-label="One part, played in a loop" data-demoshell-mark>
        <!-- Play first, top-left of the product (design 1.15). -->
        <div class="pane-bar">
          <span class="bar-start">
            <button type="button" id="play" disabled data-icon="play" data-toggle></button>
            <span class="cap" id="part-name">Part</span>
          </span>
          <span id="time" class="mono mut small"></span>
        </div>
        <div class="transport">
          <span role="group" aria-label="Which version plays" class="seg" id="views">
            <button type="button" data-view="original" aria-pressed="true">Song A</button>
            <button type="button" data-view="songb" aria-pressed="false" hidden>Song B</button>
            <button type="button" data-view="rearranged" aria-pressed="false">Rearranged</button>
          </span>
        </div>
        <dl id="songs" class="songs small" hidden>
          <div><dt>Song A</dt><dd id="song-a"></dd></div>
          <div id="song-b-row"><dt>Song B</dt><dd id="song-b"></dd></div>
        </dl>
        <div id="strip" class="strip">
          <canvas id="roll" class="behind" aria-label="Piano roll of the version playing"></canvas>
          <div id="chords" class="chords" aria-hidden="true"></div>
          <div id="head" class="playhead"></div>
          <p id="strip-msg" class="strip-msg mono mut small">loading…</p>
        </div>
        <div id="habits" class="habits" aria-label="Habits"></div>
        <p id="changed" class="changed small" aria-live="polite"></p>
      </section>

      <section class="pane" id="song-pane" hidden aria-label="The whole song" data-demoshell-mark>
        <div class="pane-bar">
          <span class="cap">Whole song</span>
          <span id="song-status" class="mono mut small"></span>
        </div>
        <p class="pane-note mut small">Pick a cover, or click a part to jump there.</p>
        <div class="transport">
          <button type="button" id="song-play" disabled data-icon="play" data-toggle></button>
          <span id="song-time" class="mono mut small"></span>
        </div>
        <div id="sections" class="sections" aria-label="Song A's parts: click one to play from there"><div id="sec-head" class="head-line"></div></div>
        <div id="covers" class="covers" role="group" aria-label="Covers of the whole song"></div>
      </section>
    </div>
  </div>

  <script type="module" src="try.js"></script>
</body>
</html>

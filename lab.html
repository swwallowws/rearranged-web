<!doctype html>
<html lang="en" data-category="transform">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rearranged project</title>
<link rel="icon" href="favicons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/design/tokens.css">
<link rel="stylesheet" href="vendor/design/playhead.css">
<link rel="stylesheet" href="app.css">
<script>
  // before paint: ?theme= wins, then the mode saved in any of the products (they share it)
  try { let t = new URLSearchParams(location.search).get("theme");
        if (t !== "paper" && t !== "night") t = localStorage.getItem("swwallowws:mode");
        if (t === "paper" || t === "night") document.documentElement.dataset.theme = t; } catch (_) {}
</script>
<style>
  /* one strip, one player, one set of settings */
  h1 { margin: 0; font-weight: var(--head-weight); letter-spacing: var(--head-tracking); font-size: 30px; color: var(--ink); text-transform: none; text-wrap: balance; }
  .sub { margin: 2px 0 20px; color: var(--ink-mut); font-size: 16px; }
  /* the strip: bar numbers, the parts, the picked part's chords, the song's notes; the lanes told apart by space and tone */
  .view { position: relative; background: var(--ground-2); padding-top: 6px; user-select: none; }
  .ruler { position: relative; height: 18px; }
  .ruler span { position: absolute; top: 0; padding-left: 3px; font: 11px/1 var(--font-mono); color: var(--ink-mut); }
  .parts { position: relative; height: 30px; margin: 4px 0; }
  .part { position: absolute; top: 0; bottom: 0; margin: 0 1px; padding: 8px 10px; background: var(--band); font: 600 13px/1 var(--font-sans);
          color: var(--ink-mut); cursor: pointer; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .part:hover { color: var(--ink); }
  .part.sel { background: var(--acc); color: var(--ground); }
  .part .own { display: inline-block; width: 6px; height: 6px; background: currentColor; margin-left: 6px; vertical-align: 1px; }
  /* chords stay quiet; one the engine isn't sure of carries a question mark, a little dimmer, and a hover shows it can be fixed */
  .chords { position: relative; height: 22px; }
  .chord { position: absolute; top: 0; padding: 4px; font: 12px/1 var(--font-mono); color: var(--ink-mut); opacity: .55;
           overflow: hidden; white-space: nowrap; cursor: pointer; }
  .chord.unsure { opacity: .38; }
  .chord.unsure::after { content: "?"; }
  .chord:hover { opacity: 1; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .rollbox { position: relative; height: 150px; }
  .behind { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .loopband { position: absolute; top: 0; bottom: 0; background: color-mix(in oklab, var(--acc) 9%, transparent); pointer-events: none; }
  .view .playhead { top: 0; z-index: 2; pointer-events: none; }
  #chord-fix:empty { display: none; }
  #chord-fix input { font: 14px var(--font-mono); width: 90px; padding: 5px 8px; border: var(--hairline); background: var(--ground-2); color: var(--ink); }
  .transport { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; margin: 12px 0 4px; }
  .transport .time { font: 13px var(--font-mono); color: var(--ink-mut); line-height: 32px; }
  /* keep and download: the icon with its words under it */
  .tool { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
  .tool-label { font-size: 13px; color: var(--ink-mut); white-space: nowrap; }
  .settings { margin-top: 28px; }
  .explain { margin: 6px 0 14px; color: var(--ink-mut); font-size: var(--text-ui); max-width: 70ch; }
  .rating { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 18px; }
  .rating .label { width: 8.5rem; color: var(--ink-mut); font-size: var(--text-ui); }
  .rating .explain { margin: 0; }
  /* covers you kept: a click takes its settings, a double-click on the name renames it, its
     rating for the picked part beside it; the one playing is marked */
  .covers { margin-top: 28px; }
  .covers ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
  .covers li { display: flex; gap: 12px; align-items: center; padding: 4px 8px; border-left: 2px solid transparent; cursor: pointer; }
  .covers li:hover { background: var(--ground-2); }
  .covers li.now { border-left-color: var(--acc); }
  .covers li .name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .covers li input { flex: 1; min-width: 0; font-size: var(--text-body); font-weight: 600; padding: 2px 6px; }
  .mini-pips { display: inline-flex; gap: 3px; }
  .mini-pips i { width: 8px; height: 8px; box-sizing: border-box; border: 1px solid var(--ink-mut); }
  .mini-pips i.on { background: var(--acc); border-color: var(--acc); }
  /* removing takes two clicks: the first arms the close, which fills in the accent */
  .covers [data-forget][data-armed] { background: var(--acc); border-color: var(--acc); color: var(--ground); }
  #sf-row { font-size: var(--text-ui); margin: 20px 0 0; }
</style>
</head>
<body>
<header class="ds-header">
  <a class="ds-wordmark" href="index.html">Rearranged<span class="dot">.</span></a>
  <span id="status" class="mono mut end">Loading…</span>
  <div class="modes end"></div>
</header>
<main>
  <p class="back"><a href="index.html">← Your projects</a></p>
  <h1 id="title">Project</h1>
  <p class="sub" id="sub"></p>

  <div class="view" id="view">
    <div class="ruler" id="ruler"></div>
    <div class="parts" id="parts" role="group" aria-label="The song's parts: pick one"></div>
    <div class="chords" id="chords" aria-label="Chords of the picked part"></div>
    <div class="rollbox" id="rollbox"><canvas id="roll" class="behind" aria-label="Piano roll of the cover"></canvas><div class="loopband" id="band"></div></div>
    <div id="head" class="playhead"></div>
  </div>
  <div class="row" id="chord-fix"></div>

  <div class="transport">
    <button id="play" type="button" data-icon="play" data-toggle data-key="Space" aria-label="Play"></button>
    <button id="loop" type="button" data-icon="loop" data-toggle aria-pressed="true" aria-label="Loop the picked part"></button>
    <span class="time" id="time"></span>
    <span class="spacer"></span>
    <span class="tool"><button id="keep" type="button" data-icon="plus" data-toggle data-pressed-icon="check" aria-label="Keep this cover"></button><span class="tool-label">keep</span></span>
    <span class="tool"><button id="download" type="button" data-icon="download" aria-label="Download this cover as MIDI"></button><span class="tool-label">download MIDI</span></span>
  </div>

  <section class="settings">
    <h2>Settings</h2>
    <label class="ds-check"><input type="checkbox" id="own"><span id="own-label">Settings for part</span></label>
    <p class="explain" id="own-note"></p>
    <div class="grid" id="switches"></div>
    <div class="rating"><span class="label">Your rating</span><span class="ds-pips" id="pips" role="group" aria-label="Your rating"></span><span class="explain" id="rate-note"></span></div>
  </section>

  <section class="covers" id="covers-box" hidden><h2>Kept covers</h2><ul id="covers"></ul></section>
  <p class="mut hidden" id="sf-row">Sounds: <span id="sf-note"></span> <a href="#" id="sf-own">use your own soundfont</a><input type="file" id="soundfont" accept=".sf2,.sf3" class="hidden"></p>
</main>
<script type="module">
import { setupRuns } from "./js/runs.js";
import { makeSynth } from "./js/synth.js";
import { seekable, heardTime } from "./vendor/design/playhead.js";
import { iconButton } from "./vendor/design/iconbutton.js";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const lid = new URLSearchParams(location.search).get("id");
const B = await setupRuns();
const synth = makeSynth(() => B.soundfont(lid));

let lab = null, parts = [], pick = 0, loopOn = true, ready = false;
let headAt = null;                      // where a drag holds the head, while it lasts
let at = 0;                             // where the head rests while nothing plays
let cover = null, bytes = null;         // the cover playing: {stem, midi}, and its file
let roll = null, ratings = {};
const songLength = () => (parts.length ? parts[parts.length - 1].end : 0);
const playing = () => synth.running && synth.mode === "song";
const now = () => (playing() ? synth.time : at);
const part = () => parts[pick];

// ---- settings: one set for the whole song; a part can have its own ("Settings for part X")
let base = { bass: "donor", guitar: "picked", lead: false, drums: "donor", feel: "half" };
let own = {};                           // part name -> that part's settings
const cur = () => own[part()?.name] || base;
const NAMES = { bass: "Bass", guitar: "Guitar", lead: "Your lead guitar", drums: "Drums", feel: "Feel" };
const CHOICES = { guitar: [["picked", "Picked"], ["strummed", "Strummed"]], lead: [[true, "Kept"], [false, "Out"]],
                  feel: [["half", "Half-time"], ["straight", "Full speed"]] };
const AB = { bass: { song: "Yours", donor: "Song B style" }, drums: { song: "Yours", donor: "Song B groove" } };
const lastDrums = {};                   // the side drums come back on, per scope
const scope = () => (own[part()?.name] ? part().name : "");

// Song A or Song B: plain letters either side of a switch (design's .ds-switch)
function abSwitch(k, side, off) {
  const w = AB[k], dis = off ? " disabled" : "", other = side === "song" ? "donor" : "song";
  const end = (l, letter) => `<button type="button" class="${side === l ? "on" : ""}" data-k="${k}" data-v="${l}" title="${w[l]}" aria-label="${NAMES[k]}: ${w[l]}"${dis}>${letter}</button>`;
  return `<span class="ds-switch" role="group" aria-label="${NAMES[k]}">${end("song", "A")}<button type="button" class="ds-switch-track" data-k="${k}"
    data-v="${other}" title="${w[other]}" aria-label="${NAMES[k]}: ${w[other]}"${dis}></button>${end("donor", "B")}</span>`;
}
function drawSettings() {
  const s = cur(), p = part();
  const name = p ? `<i>${esc(p.name)}</i>` : "";
  $("own-label").innerHTML = `<span>Settings for part ${name}</span>`;   // one item: the square's gap stays out of the words
  $("own").checked = !!own[p?.name];
  $("own-note").innerHTML = own[p?.name]
    ? `These settings play in part ${name} only; the rest of the song keeps its own.`
    : "These settings play through the whole song.";
  if (s.drums !== "none") lastDrums[scope()] = s.drums;
  const choice = (k) => `<span class="label">${NAMES[k]}</span><span class="choice ds-choice">${CHOICES[k].map(([v, label]) =>
    `<button type="button" class="${s[k] === v ? "on" : ""}" data-k="${k}" data-v="${v}">${label}</button>`).join("")}</span>`;
  $("switches").innerHTML =
    `<span class="label">${NAMES.bass}</span>${abSwitch("bass", s.bass)}` + choice("guitar") + choice("lead") +
    `<label class="ds-check label"><input type="checkbox" id="drums-on"${s.drums !== "none" ? " checked" : ""}><span>${NAMES.drums}</span></label>` +
    abSwitch("drums", lastDrums[scope()] || "donor", s.drums === "none") + choice("feel");
  drawParts();
  drawRating();
}
$("switches").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-k]");
  if (!b || b.disabled) return;
  const v = b.dataset.v;
  cur()[b.dataset.k] = v === "true" ? true : v === "false" ? false : v;
  changed();
});
$("switches").addEventListener("change", (e) => {
  if (e.target.id !== "drums-on") return;
  cur().drums = e.target.checked ? lastDrums[scope()] || "donor" : "none";
  changed();
});
$("own").onchange = () => {
  const n = part().name;
  if ($("own").checked) own[n] = { ...base }; else delete own[n];
  changed();
};
function changed() { drawSettings(); renderCover(); }

// ---- the rating: of the picked part as the settings make it, kept for when you come back
const rateKey = () => { const s = cur(); return [part().name, s.bass, s.guitar, s.lead, s.drums, s.feel].join("|"); };
function drawRating() {
  if (!part()) return;
  const r = ratings[rateKey()] || 0, name = `<i>${esc(part().name)}</i>`;
  $("pips").innerHTML = [1, 2, 3, 4, 5].map((n) => `<button type="button" class="${n <= r ? "on" : ""}" data-s="${n}" aria-pressed="${n === r}" aria-label="Rate ${n} of 5" title="${n} of 5"></button>`).join("");
  $("rate-note").innerHTML = r ? `your rating for part ${name} with these settings` : `not rated yet: how does part ${name} sound?`;
  drawList();                           // the kept covers show the picked part's ratings too
}
$("pips").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-s]");
  if (!b) return;
  const n = +b.dataset.s, key = rateKey();
  ratings = await B.rateConfig(lid, key, ratings[key] === n ? 0 : n);   // the same pip again clears it
  drawRating();
});

// ---- the cover: the whole song with the settings, made in the browser (a cover already made
// comes back at once); playing, it swaps in at the same moment
// a part's own settings go along only where they differ from the song's, so the same sound is
// always the same cover
const KEYS = ["bass", "guitar", "lead", "drums", "feel"];
const differs = (p) => Object.fromEntries(KEYS.filter((k) => p[k] !== base[k]).map((k) => [k, p[k]]));
const body = () => ({ ...base, parts: Object.fromEntries(Object.entries(own)
  .filter(([n]) => parts.some((p) => p.name === n)).map(([n, p]) => [n, differs(p)]).filter(([, d]) => Object.keys(d).length)) });
let asked = 0;
async function renderCover() {
  const my = ++asked;
  $("status").textContent = "making the cover…";
  try {
    const r = await B.cover(lid, body());
    if (my !== asked) return;
    await show(r);
    $("status").textContent = "";
  } catch (err) { $("status").textContent = err.message; }
  listCovers();
}
async function show(r) {
  if (cover?.stem === r.stem) return;
  cover = r;
  drawKeep();
  drawList();
  bytes = B.fileBytes(lid, r.midi);
  if (playing()) start(synth.time);
  const got = await B.coverRoll(lid, r.stem);
  if (cover?.stem !== r.stem) return;
  const ps = got.notes.map((n) => n.p);
  roll = { ...got, range: ps.length ? [Math.min(...ps) - 1, Math.max(...ps) + 1] : [48, 72] };
  drawRoll();
}

// ---- the player: the cover from the playhead; with the loop on it repeats the picked part
const playBtn = iconButton($("play"));
const loopBtn = iconButton($("loop"), { onPress: (on) => { loopOn = on; drawBand(); } });
async function start(from) {
  if (!cover) return;
  const p = part();
  if (loopOn && p && (from < p.start - 1e-3 || from >= p.end - 0.05)) from = p.start;
  try {
    await synth.start(cover.midi, bytes, from, { mode: "song" });
  } catch (err) { $("status").textContent = `no playback: ${err.message}`; return; }
  playBtn.setPressed(true);
}
function stop() { at = synth.time; synth.stop(); playBtn.setPressed(false); }
$("play").onclick = () => { synth.audio(); if (playing()) stop(); else start(at); };
synth.onended = () => { synth.running = false; at = 0; playBtn.setPressed(false); };

// a click or drag anywhere on the notes moves the playhead (the design system's playhead.js):
// playing, the head follows the pointer and the sound moves once, on release
seekable($("rollbox"), {
  duration: () => songLength(),
  enabled: () => ready,
  onScrub: (t) => { headAt = t; if (!playing()) at = t; },
  onSeek: (t) => { headAt = null; if (playing()) start(t); else at = t; pickAt(t); },
  onCancel: () => { headAt = null; },
});
function pickAt(t) {
  const i = parts.findIndex((p) => t >= p.start && t < p.end);
  if (i >= 0 && i !== pick) choose(i, false);
}

// the loop: at the picked part's end, back to its start
function follow() {
  const p = part();
  if (playing() && loopOn && p && synth.time >= p.end - 0.02) start(p.start);
  const t = Math.min(headAt ?? (playing() ? heardTime(synth.time, synth.from, synth.ctx) : at), songLength());
  if (songLength()) {
    $("head").style.left = `${(100 * t) / songLength()}%`;
    $("time").textContent = `${fmt(t)} / ${fmt(songLength())}`;
    if (playing()) drawRoll();
  }
  requestAnimationFrame(follow);
}

// ---- the strip
function drawRuler() {
  // bar lines from each part's bars and times; numbered as many as fit
  const ticks = [];
  for (const p of parts) {
    if (!p.bars) continue;
    const [a, b] = p.bars, len = (p.end - p.start) / Math.max(1, b - a + 1);
    for (let n = a; n <= b; n++) ticks.push([n, p.start + (n - a) * len]);
  }
  const w = $("view").clientWidth || 1, every = [1, 2, 4, 8, 16, 32, 64].find((s) => (s * w) / Math.max(1, ticks.length) >= 26) || 128;
  $("ruler").innerHTML = ticks.filter(([n]) => (n - 1) % every === 0).map(([n, t]) => `<span style="left:${(100 * t) / songLength()}%">${n}</span>`).join("");
}
function drawParts() {
  const L = songLength() || 1;
  $("parts").innerHTML = parts.map((p, i) => `<span class="part${i === pick ? " sel" : ""}" data-i="${i}" style="left:${(100 * p.start) / L}%;width:calc(${(100 * (p.end - p.start)) / L}% - 2px)"
    title="${esc(p.name)}">${esc(p.name)}${own[p.name] ? '<span class="own" title="has its own settings"></span>' : ""}</span>`).join("");
  drawBand();
}
function drawBand() {
  const p = part(), L = songLength() || 1;
  $("band").hidden = !(loopOn && p);
  if (p) { $("band").style.left = `${(100 * p.start) / L}%`; $("band").style.width = `${(100 * (p.end - p.start)) / L}%`; }
}
$("parts").addEventListener("click", (e) => {
  const el = e.target.closest(".part");
  if (el) choose(+el.dataset.i, true);
});
// picking a part: its chords come from the project rebuilt for it (it keeps the chord fixes)
async function choose(i, jump) {
  pick = i;
  if (jump) { if (playing()) start(part().start); else at = part().start; }
  drawSettings();
  $("chords").innerHTML = "";
  if (lab && lab.part_index !== i) {
    await B.setPart(lid, i);
    await reloadLab();
  } else drawChords();
}
async function reloadLab() {
  for (;;) {
    lab = await B.lab(lid);
    if (!lab.busy) break;
    $("status").textContent = "rebuilding…";
    await new Promise((ok) => setTimeout(ok, 200));
  }
  $("status").textContent = lab.error ? `rebuild failed: ${lab.error}` : "";
  if (lab.part_index === pick) drawChords();
}

// chord names as charts write them: Cmaj7 as CM7, Csus4 as Csus (the full name in the tooltip)
const short = (c) => c.replace("maj7", "M7").replace("sus4", "sus");
function drawChords() {
  const L = songLength() || 1, p = part();
  $("chords").innerHTML = lab.segments.filter((s) => s.chord && s.end > p.start && s.start < p.end).map((s) => {
    const a = Math.max(s.start, p.start), b = Math.min(s.end, p.end), unsure = s.confidence < 0.05;
    return `<span class="chord${unsure ? " unsure" : ""}" data-index="${s.index}" style="left:${(100 * a) / L}%;width:${(100 * (b - a)) / L}%"
      title="${esc(s.chord)}${unsure ? ": not sure about this one" : ""}, click to fix it">${esc(short(s.chord))}</span>`;
  }).join("");
  for (const el of $("chords").children) {           // a name longer than its box steps down, to 10px
    for (let px = 12; el.scrollWidth > el.clientWidth && px > 10;) el.style.fontSize = `${--px}px`;
  }
}
$("chords").addEventListener("click", (e) => {
  const el = e.target.closest(".chord");
  if (el) fixChord(+el.dataset.index);
});
function fixChord(index) {
  const s = lab.segments.find((x) => x.index === index);
  $("chord-fix").innerHTML = `<span class="mut">Chord at ${fmt(s.start)}</span><input id="chord-name" value="${esc(s.chord || "")}" aria-label="Chord name">
    <button id="chord-save" type="button" data-icon="check" aria-label="Rebuild with this chord"></button><span class="mut">or ${esc(s.runner_up || "none")}</span>`;
  iconButton($("chord-save"), { onPress: async () => {
    try {
      await B.chord(lid, index, $("chord-name").value.trim());
      $("chord-fix").innerHTML = "";
      await reloadLab();
      cover = null; renderCover();                    // the cover follows the fixed chord
    } catch (err) { $("status").textContent = err.message; }
  } });
  $("chord-name").focus();
}

// ---- the piano roll of the cover (design/roll.md), notes tinted by pitch, sounding notes in full accent
let palette = null;
function colorOf(token) {
  const el = document.createElement("span");
  el.style.color = `var(${token})`; document.body.appendChild(el);
  const m = getComputedStyle(el).color.match(/[\d.]+/g).slice(0, 3).map(Number); el.remove();
  return m;
}
const rgb = (c) => `rgb(${c.map(Math.round).join(",")})`;
const mix = (a, b, p) => rgb(a.map((x, i) => x * p + b[i] * (1 - p)));
const readPalette = () => ({ acc: colorOf("--acc"), ground: colorOf("--ground-2"), band: colorOf("--band"), ink: colorOf("--ink") });
function drawRoll() {
  const cv = $("roll"), dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight, L = songLength();
  if (!w || !L) return;
  palette = palette || readPalette();
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const { acc, ground, band, ink } = palette;
  g.clearRect(0, 0, w, h);
  if (!roll) return;
  const [lo, hi] = roll.range, rh = (h - 4) / (hi - lo + 1), xs = w / L, y = (p) => h - 2 - (p - lo + 1) * rh;
  g.fillStyle = mix(band, ground, 0.45);
  for (let p = lo; p <= hi; p++) if ([1, 3, 6, 8, 10].includes(((p % 12) + 12) % 12)) g.fillRect(0, y(p), w, rh);
  const t = playing() ? synth.time : -1;
  for (const n of roll.notes) {
    const on = t >= n.s && t < n.e, x = n.s * xs, nw = Math.max(1, (n.e - n.s) * xs - 1), ny = y(n.p), nh = Math.max(1, rh - 1);
    g.fillStyle = on ? rgb(acc) : mix(acc, ground, 0.4 + 0.6 * Math.max(0, Math.min(1, (n.p - lo) / Math.max(1, hi - lo))));
    g.fillRect(x, ny, nw, nh);
    if (on && nh > 2) { g.strokeStyle = rgb(ink); g.lineWidth = 1; g.strokeRect(x + 0.5, ny + 0.5, nw - 1, nh - 1); }
  }
}
const repaint = () => { palette = readPalette(); drawRoll(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", repaint);
addEventListener("themechange", repaint);
addEventListener("resize", () => { drawRuler(); drawRoll(); if (lab) drawChords(); });

// ---- covers you keep: the plus keeps the one playing, under a name you can change; play one to
// take its settings back, save its MIDI, or take it off the list
let covers = [];
const keepBtn = iconButton($("keep"), { onPress: async (on) => {
  if (!cover) return;
  if (on) await B.keepCover(lid, cover.stem, `Cover ${covers.filter((c) => c.kept).length + 1}`);
  else await B.forgetCover(lid, cover.stem);
  listCovers();
} });
function drawKeep() { keepBtn.setPressed(!!covers.find((c) => c.stem === cover?.stem)?.kept); }
const WORDS = { bass: (v) => `bass ${v === "donor" ? "B" : "A"}`, guitar: (v) => v, lead: (v) => `lead ${v === true || v === "true" ? "kept" : "out"}`,
                drums: (v) => (v === "none" ? "no drums" : `drums ${v === "donor" ? "B" : "A"}`), feel: (v) => (v === "half" ? "half-time" : "full speed") };
// "bass B · picked · lead out · drums B · half-time", then what a part plays differently: "no drums in verse"
function describe(s) {
  const head = KEYS.map((k) => WORDS[k](s[k])).join(" · ");
  const ps = Object.entries(s.parts || {}).map(([n, p]) => `${KEYS.filter((k) => k in p).map((k) => WORDS[k](p[k])).join(", ")} in <i>${esc(n)}</i>`);
  return [head, ...ps].join(" · ");
}
async function listCovers() {
  covers = (await B.covers(lid)).filter((c) => c.status === "done");
  drawKeep();
  drawList();
}
// the list from what is known: redrawn when the part, a rating or the cover playing changes
function drawList() {
  const list = covers.filter((c) => c.kept).sort((a, b) => b.keptAt - a.keptAt);
  $("covers-box").hidden = !list.length;
  const plain = (s) => describe(s).replace(/<\/?i>/g, "");
  $("covers").innerHTML = list.map((c) => `<li data-stem="${c.stem}" class="${c.stem === cover?.stem ? "now" : ""}" title="${esc(plain(c.settings))}">
    <span class="name" title="Double-click to rename">${esc(c.name || "Cover")}</span>${miniPips(ratingOf(c.settings))}
    <button type="button" data-forget="${c.stem}" data-icon="close" data-size="s" aria-label="Take it off the list"></button></li>`).join("");
  $("covers").querySelectorAll("[data-icon]").forEach((b) => iconButton(b));
}
// the picked part's rating with a cover's settings (its own settings there, if it has them)
function ratingOf(s) {
  const p = part();
  if (!p) return 0;
  const x = { bass: s.bass, guitar: s.guitar, lead: !!s.lead, drums: s.drums, feel: s.feel, ...(s.parts?.[p.name] || {}) };
  return ratings[[p.name, x.bass, x.guitar, x.lead === true || x.lead === "true", x.drums, x.feel].join("|")] || 0;
}
const miniPips = (n) => `<span class="mini-pips" role="img" aria-label="${n ? `rated ${n} of 5` : "not rated"}">${[1, 2, 3, 4, 5].map((s) => `<i class="${s <= n ? "on" : ""}"></i>`).join("")}</span>`;
// a click on a kept cover takes its settings (and plays it when something plays); a double-click on
// its name renames it; the close removes it on a second click
let arm = null;
$("covers").addEventListener("click", async (e) => {
  const x = e.target.closest("[data-forget]");
  if (x) {
    if (x.hasAttribute("data-armed")) { clearTimeout(arm); await B.forgetCover(lid, x.dataset.forget); listCovers(); return; }
    $("covers").querySelectorAll("[data-armed]").forEach((b) => b.removeAttribute("data-armed"));
    x.setAttribute("data-armed", ""); x.title = "Click again to remove";
    clearTimeout(arm);
    arm = setTimeout(() => { x.removeAttribute("data-armed"); x.title = "Take it off the list"; }, 4000);
    return;
  }
  const li = e.target.closest("li[data-stem]");
  if (!li || e.target.closest("input") || li.dataset.stem === cover?.stem) return;   // already playing
  // on the name, wait a moment: a second click renames instead
  clearTimeout(useLater);
  useLater = setTimeout(async () => {
    take(covers.find((c) => c.stem === li.dataset.stem).settings);
    await renderCover();
  }, e.target.closest(".name") ? 260 : 0);
});
let useLater = null;
$("covers").addEventListener("dblclick", (e) => {
  const n = e.target.closest(".name");
  if (!n) return;
  clearTimeout(useLater);
  const stem = n.closest("li").dataset.stem;
  const input = document.createElement("input");
  input.className = "ds-field"; input.value = n.textContent; input.setAttribute("aria-label", "Name of this cover");
  n.replaceWith(input); input.focus(); input.select();
  const done = async (keep) => { if (keep) await B.renameCover(lid, stem, input.value); listCovers(); };
  input.addEventListener("keydown", (k) => { if (k.key === "Enter") input.blur(); if (k.key === "Escape") { input.onblur = null; done(false); } });
  input.onblur = () => done(true);
});
// a cover's settings back into the page
function take(s) {
  base = { bass: s.bass, guitar: s.guitar, lead: !!s.lead, drums: s.drums, feel: s.feel };
  own = {};
  for (const [n, p] of Object.entries(s.parts || {})) own[n] = { ...base, ...p, lead: p.lead === undefined ? base.lead : !!p.lead };
  drawSettings();
}
async function save(midi) {
  const url = await B.download(lid, midi);
  if (!url) return;
  const a = document.createElement("a");
  const kept = covers.find((c) => c.midi === midi && c.kept);         // a kept cover saves under its name
  a.href = url; a.download = `${$("title").textContent}, ${kept?.name || "rearranged"}.mid`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
iconButton($("download"), { onPress: () => { if (cover) save(cover.midi); } });

// ---- sounds: the built-in General MIDI bank, or a soundfont of your own kept in this browser;
// a change reloads the page so the player picks it up
if (B.setSoundfont) {
  $("sf-row").classList.remove("hidden");
  let mine = false;
  const showSf = (sf) => {
    mine = !sf.builtin;
    $("sf-note").textContent = mine ? `${sf.name}, kept in this browser ·` : "built-in General MIDI ·";
    $("sf-own").textContent = mine ? "use the built-in sounds" : "use your own soundfont";
  };
  B.soundfontInfo().then(showSf);
  $("sf-own").onclick = async (e) => { e.preventDefault(); if (mine) { await B.clearSoundfont(); location.reload(); } else $("soundfont").click(); };
  $("soundfont").onchange = async () => {
    const f = $("soundfont").files[0];
    if (!f) return;
    try { await B.setSoundfont(f); location.reload(); } catch (err) { $("sf-note").textContent = err.message; }
  };
}

addEventListener("keydown", (e) => {
  if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName) || !ready) return;
  if (e.code === "Space") { e.preventDefault(); $("play").click(); }
});

// ---- open: the songs' names, the parts, the project's part, the latest cover's settings
async function open() {
  const [labs, ps] = await Promise.all([B.labs(), B.parts(lid)]);
  const me = labs.find((l) => l.id === lid);
  if (me) { $("title").textContent = me.title; $("sub").textContent = me.donor ? `in the style of ${me.donor}` : ""; document.title = `${me.title} · Rearranged`; }
  parts = ps;
  ratings = await B.configRatings(lid);
  await reloadLab();
  pick = Math.max(0, Math.min(parts.length - 1, lab.part_index ?? 0));
  at = part()?.start || 0;
  const last = (await B.covers(lid)).find((c) => c.status === "done");
  if (last) take(last.settings); else drawSettings();
  drawRuler(); drawChords();
  ready = true;
  synth.audio();
  synth.init().catch((err) => { $("status").textContent = `no playback: ${err.message}`; });
  follow();
  await renderCover();
}

// a small read-only handle for checks (tools/browser-check.mjs reads it; nothing here depends on it)
window.rearrangedLab = {
  get ready() { return ready; }, get playing() { return playing(); }, get songSrc() { return cover?.midi || ""; },
  get songTime() { return now(); }, get songLength() { return songLength(); }, get part() { return pick; },
  get partSpan() { return part() ? [part().start, part().end] : [0, 0]; },
  get loop() { return loopOn; }, get settings() { return JSON.parse(JSON.stringify(body())); },
  get synthLoaded() { return synth.loaded; }, get peak() { return synth.peak(); },
};
open().catch((err) => { $("status").textContent = err.message; });
</script>
</body>

<!doctype html>
<html lang="en" data-category="transform">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rearranged</title>
<link rel="icon" href="favicons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/design/tokens.css">
<link rel="stylesheet" href="app.css">
<script>
  // before paint: ?theme= wins, then the mode saved in any of the products (they share it)
  try { let t = new URLSearchParams(location.search).get("theme");
        if (t !== "paper" && t !== "night") t = localStorage.getItem("swwallowws:mode");
        if (t === "paper" || t === "night") document.documentElement.dataset.theme = t; } catch (_) {}
</script>
<style>
  .lab-row { display: flex; gap: 12px; align-items: center; border-bottom: var(--hairline); }
  .lab { flex: 1; display: flex; gap: 16px; align-items: baseline; padding: 12px 0;
         color: inherit; text-decoration: none; flex-wrap: wrap; }
  .lab:hover b { color: var(--acc); }
  .lab b { font-size: 16px; }
  /* two clicks to delete: the first fills it in the accent, the second deletes */
  .lab-del[data-armed] { background: var(--acc); border-color: var(--acc); color: var(--ground); }
</style>
</head>
<body>
<header class="ds-header">
  <a class="ds-wordmark" href="index.html">Rearranged<span class="dot">.</span></a>
  <div class="modes end"></div>
</header>
<main>
  <div class="section-head" style="border-top:0;margin-top:0;padding-top:0">
    <h2>Your projects</h2><span class="spacer"></span><a class="ds-button primary" href="new.html">New project</a>
  </div>
  <p class="mut">Rearrange a song in the style of another.</p>
  <div id="labs" class="mut">Loading…</div>
</main>
<script type="module">
import { labHref, setupRuns } from "./js/runs.js";
import { iconButton } from "./vendor/design/iconbutton.js";
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const box = document.getElementById("labs");
try {
  const B = await setupRuns();
  const labs = await B.labs();
  // nothing to list yet: start a new project straight away
  if (!labs.length) location.replace("new.html");
  else {
    box.classList.remove("mut");
    box.innerHTML = labs.map((l) =>
      `<div class="lab-row" data-id="${esc(l.id)}"><a class="lab" href="${labHref(l.id)}"><b>${esc(l.title)}</b>` +
      `${l.donor ? `<span class="mut">with ${esc(l.donor)}</span>` : ""}<span>${esc(l.part)}</span>` +
      `<span class="spacer"></span><span class="mut mono">${new Date(l.at * 1000).toLocaleString([], {dateStyle: "short", timeStyle: "short"})}</span></a>` +
      `<button type="button" class="lab-del" data-icon="close" data-size="s" data-label="Delete this project"></button></div>`).join("");
    let armed = null, disarm = 0;
    const calm = () => { clearTimeout(disarm); if (armed) { armed.removeAttribute("data-armed"); armed.title = "Delete this project"; } armed = null; };
    for (const b of box.querySelectorAll(".lab-del")) {
      iconButton(b);
      b.addEventListener("click", async () => {
        const row = b.closest(".lab-row");
        if (armed !== b) {
          calm();
          armed = b;
          b.setAttribute("data-armed", "");
          b.title = `Click again to delete ${row.querySelector("b").textContent}`;
          disarm = setTimeout(calm, 4000);
          return;
        }
        calm();
        try { await B.deleteLab(row.dataset.id); } catch (err) { box.insertAdjacentText("afterbegin", err.message); return; }
        row.remove();
        if (!box.querySelector(".lab-row")) location.replace("new.html");
      });
    }
  }
} catch (err) {
  box.textContent = err.message;
}
</script>
</body>
</html>
